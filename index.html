<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Codex Kanban · 任务看板</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="icon-warning" viewBox="0 0 24 24"><path d="M10.3 4.8 2.8 18a2 2 0 0 0 1.7 3h15a2 2 0 0 0 1.7-3L13.7 4.8a2 2 0 0 0-3.4 0Z"/><path d="M12 9v5M12 17h.01"/></symbol>
    <symbol id="icon-kanban" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="4"/><path d="M9 7v10M15 7v10M5.5 8v4M12 8v7M18.5 8v2"/></symbol>
    <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M3 7V6a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="var(--icon-fill,#fff)"/><circle cx="15" cy="17" r="3" fill="var(--icon-fill,#fff)"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="icon-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="icon-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="icon-eye-off" viewBox="0 0 24 24"><path d="M9.9 5.2A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-2.9 3.9M6.6 6.6C3.7 8.5 2 12 2 12s3.6 7 10 7a9.8 9.8 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18"/></symbol>
    <symbol id="icon-comment" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 1-8 8H4l1.5-4A8 8 0 1 1 20 11Z"/></symbol>
  </defs></svg>

  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><svg class="ui-icon" aria-hidden="true"><use href="#icon-kanban"></use></svg><span>Codex <span class="brand-muted">Kanban</span></span></div>
      <button class="nav-item" data-action="new-project"><svg class="ui-icon" aria-hidden="true"><use href="#icon-plus"></use></svg>新建项目</button>
      <div class="side-title">项目</div>
      <nav id="project-list" class="project-list" aria-label="项目"></nav>
      <div class="sidebar-bottom">
        <div class="side-status"><span id="connection-dot" class="dot"></span><span id="connection-text">检查 Codex…</span></div>
        <div class="side-status"><span class="dot"></span><span id="sync-status" role="status">正在连接…</span></div>
      </div>
    </aside>

    <main class="main">
      <div class="m-top">
        <label class="m-project"><span class="visually-hidden">选择项目</span><select id="mobile-project"></select><svg class="ui-icon" aria-hidden="true"><use href="#icon-chevron-down"></use></svg></label>
        <button class="icon-button" data-action="toggle-search" aria-label="搜索"><svg class="ui-icon" aria-hidden="true"><use href="#icon-search"></use></svg></button>
        <button class="icon-button" data-action="project-settings" aria-label="项目设置"><svg class="ui-icon" aria-hidden="true"><use href="#icon-settings"></use></svg></button>
      </div>

      <header class="page-head">
        <h1 id="page-title">任务看板</h1>
        <div class="head-actions">
          <div id="agent-control" class="agent-control">
            <span id="agent-dot" class="agent-dot"></span>
            <span class="agent-text"><strong>自动认领</strong><small id="agent-status"></small></span>
            <label class="switch-wrap"><input id="auto-toggle" type="checkbox" aria-label="自动认领待办（当前项目）"><span class="switch"></span></label>
          </div>
          <button class="btn btn-secondary btn-lg desktop-only" data-action="project-settings"><svg class="ui-icon" aria-hidden="true"><use href="#icon-settings"></use></svg>项目设置</button>
          <button class="btn btn-primary btn-lg desktop-only" data-action="new-card"><svg class="ui-icon" aria-hidden="true"><use href="#icon-plus"></use></svg>新建任务</button>
        </div>
      </header>

      <nav class="toolbar">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" data-action="board">看板</button>
          <button class="tab" role="tab" data-action="overview">概览</button>
        </div>
        <div id="attention" class="attention"></div>
        <div class="toolbar-right">
          <label id="search-box" class="search-box"><svg class="ui-icon" aria-hidden="true"><use href="#icon-search"></use></svg><input id="search" type="search" placeholder="搜索任务" aria-label="搜索任务" autocomplete="off"></label>
          <button id="history-toggle" class="btn btn-secondary" data-action="history" aria-pressed="false">显示已完成 / 已取消</button>
        </div>
      </nav>

      <div id="mobile-tabs" class="m-tabs" role="tablist" aria-label="看板列"></div>
      <div class="m-hint"><span id="mobile-hint"></span><button id="mobile-history" class="text-button" data-action="history">显示已完成</button></div>

      <section id="notice" class="notice" hidden></section>
      <section id="board" class="board" aria-label="任务看板"></section>
      <section id="overview" class="overview" hidden></section>
      <section id="empty" class="empty-state" hidden><h2>还没有项目</h2><p>新建一个项目，开始记录任务。</p><button class="btn btn-primary btn-lg" data-action="new-project">新建项目</button></section>
    </main>
  </div>

  <button class="fab" data-action="new-card"><svg class="ui-icon" aria-hidden="true"><use href="#icon-plus"></use></svg>新建任务</button>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
